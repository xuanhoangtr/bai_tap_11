<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/admin}">
<head><title>Chi tiết sản phẩm</title></head>
<body>
<main layout:fragment="content">
  <a class="back-link" th:href="@{/admin/products}">← Quay lại danh sách sản phẩm</a>
  <div class="profile-card mt-3">
    <div class="row g-4 align-items-start">
      <div class="col-md-5"><img class="detail-poster" th:if="${product.image != null and !product.image.isBlank()}" th:src="${#strings.startsWith(product.image, 'upload-') ? '/product-images/' + product.image : '/images/' + product.image}" alt="Ảnh sản phẩm"><div class="detail-image-placeholder" th:unless="${product.image != null and !product.image.isBlank()}">Chưa có ảnh sản phẩm</div></div>
      <div class="col-md-7"><p class="eyebrow">PRODUCT DETAIL</p><h1 th:text="${product.productName}"></h1><span class="badge text-bg-success" th:if="${product.active}">Đang bán</span><span class="badge text-bg-secondary" th:unless="${product.active}">Đã ẩn</span>
        <div class="profile-grid"><div><span>Mã sản phẩm</span><strong th:text="${product.productCode}"></strong></div><div><span>Danh mục</span><strong th:text="${product.categoryName != null ? product.categoryName : 'Chưa phân loại'}"></strong></div><div><span>Giá</span><strong th:text="${#numbers.formatInteger(product.price, 0, 'POINT') + ' ₫'}"></strong></div><div><span>Tồn kho</span><strong th:text="${product.stock}"></strong></div><div class="span-all"><span>Mô tả</span><strong th:text="${product.description != null ? product.description : 'Chưa có mô tả'}"></strong></div></div>
      </div>
    </div>
    <div class="d-flex gap-2 mt-4"><a class="btn btn-primary" th:href="@{/admin/products/{id}/edit(id=${product.productId})}">Sửa sản phẩm</a><a class="btn btn-outline-secondary" th:href="@{/admin/products}">Danh sách</a></div>
  </div>
</main>
</body>
</html>
