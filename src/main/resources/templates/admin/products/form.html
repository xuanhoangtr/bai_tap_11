<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/admin}">
<head><title th:text="${newProduct ? 'Thêm sản phẩm' : 'Cập nhật sản phẩm'}">Sản phẩm</title></head>
<body>
<main layout:fragment="content">
  <div class="auth-shell"><div class="auth-card wide-card">
    <p class="eyebrow">PRODUCT MANAGEMENT</p><h1 th:text="${newProduct ? 'Thêm sản phẩm' : 'Cập nhật sản phẩm'}"></h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form method="post" enctype="multipart/form-data" th:action="@{/admin/products/save}" th:object="${product}">
      <input type="hidden" name="newProduct" th:value="${newProduct}"><input type="hidden" th:field="*{productId}">
      <div class="row g-3">
        <div class="col-md-4"><label>Mã sản phẩm</label><input class="form-control" th:field="*{productCode}" maxlength="40" required></div>
        <div class="col-md-8"><label>Tên sản phẩm</label><input class="form-control" th:field="*{productName}" maxlength="160" required></div>
        <div class="col-md-6"><label>Danh mục</label><input class="form-control" th:field="*{categoryName}" maxlength="100" placeholder="Ví dụ: Thiết bị học tập"></div>
        <div class="col-md-3"><label>Giá (₫)</label><input class="form-control" type="number" th:field="*{price}" min="0" step="0.01" required></div>
        <div class="col-md-3"><label>Tồn kho</label><input class="form-control" type="number" th:field="*{stock}" min="0" required></div>
        <div class="col-12"><label>Ảnh sản phẩm (không bắt buộc)</label><input class="form-control" type="file" name="imageFile" accept="image/jpeg,image/png,.jpg,.jpeg,.png"><small class="text-muted">Chọn ảnh JPEG hoặc PNG từ máy, tối đa 5 MB. Để trống nếu chưa có ảnh.</small><div class="d-flex align-items-center gap-3 mt-3" th:if="${product.image != null and !product.image.isBlank()}"><img class="product-upload-preview" th:src="${#strings.startsWith(product.image, 'upload-') ? '/product-images/' + product.image : '/images/' + product.image}" alt="Ảnh hiện tại"><span class="text-muted">Nếu không chọn ảnh mới, ảnh hiện tại sẽ được giữ lại.</span></div></div>
        <div class="col-12"><label>Mô tả</label><textarea class="form-control" th:field="*{description}" rows="4" maxlength="1000"></textarea></div>
        <div class="col-12 form-check form-switch ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Đang bán trên cửa hàng</label></div>
      </div>
      <div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Lưu sản phẩm</button><a class="btn btn-outline-secondary" th:href="@{/admin/products}">Hủy</a></div>
    </form>
  </div></div>
</main>
</body>
</html>
