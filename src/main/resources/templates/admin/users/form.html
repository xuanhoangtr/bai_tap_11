<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/admin}">
<head><title th:text="${newUser ? 'Thêm user' : 'Cập nhật user'}">User</title></head>
<body>
<main layout:fragment="content"><div class="auth-shell"><div class="auth-card wide-card"><p class="eyebrow">USER MANAGEMENT</p><h1 th:text="${newUser ? 'Thêm user' : 'Cập nhật user'}"></h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/admin/users/save}" th:object="${user}"><input type="hidden" name="newUser" th:value="${newUser}"><input type="hidden" th:field="*{userId}"><div class="row g-3"><div class="col-md-6"><label>Tên đăng nhập</label><input class="form-control" th:field="*{username}" required></div><div class="col-md-6"><label>Mật khẩu <small class="text-muted" th:if="${!newUser}">(để trống nếu giữ nguyên)</small></label><input class="form-control" type="password" th:field="*{password}" th:required="${newUser}"></div><div class="col-md-6"><label>Họ tên</label><input class="form-control" th:field="*{fullname}" required></div><div class="col-md-6"><label>Email</label><input class="form-control" type="email" th:field="*{email}" required></div><div class="col-md-6"><label>Số điện thoại</label><input class="form-control" th:field="*{phone}"></div><div class="col-md-3 form-check form-switch mt-5 ms-3"><input class="form-check-input" type="checkbox" th:field="*{admin}"><label class="form-check-label">Quyền admin</label></div><div class="col-md-3 form-check form-switch mt-5"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Đang hoạt động</label></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Lưu user</button><a class="btn btn-outline-secondary" th:href="@{/admin/users}">Hủy</a></div></form></div></div></main>
</body>
</html>
