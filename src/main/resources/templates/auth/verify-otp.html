<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/user}">
<head><title>Xác nhận OTP</title></head>
<body><main layout:fragment="content"><div class="auth-shell"><div class="auth-card"><p class="eyebrow">EMAIL VERIFICATION</p><h1>Xác nhận OTP</h1><p class="text-muted">Nhập mã 6 chữ số đã được gửi đến email đăng ký.</p><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/verify-otp}"><input type="hidden" name="username" th:value="${username}"><input class="form-control form-control-lg text-center letter-space mb-4" name="otp" maxlength="6" required placeholder="000000"><button class="btn btn-primary w-100">Kích hoạt tài khoản</button></form></div></div></main></body>
</html>
