<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/user}">
<head><title>Đăng nhập</title></head>
<body><main layout:fragment="content"><div class="auth-shell"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Đăng nhập</h1><p class="text-muted">Đăng nhập để lưu video yêu thích và chia sẻ nội dung.</p><div class="alert alert-success" th:if="${message}" th:text="${message}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/login}" th:object="${loginForm}"><label>Tên đăng nhập</label><input class="form-control mb-3" th:field="*{username}" required><label>Mật khẩu</label><input class="form-control mb-4" type="password" th:field="*{password}" required><button class="btn btn-primary w-100">Đăng nhập</button></form><p class="mt-4 text-center">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p></div></div></main></body>
</html>
