<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/user}">
<head><title>Đăng ký</title></head>
<body><main layout:fragment="content"><div class="auth-shell"><div class="auth-card wide"><p class="eyebrow">CREATE ACCOUNT</p><h1>Đăng ký tài khoản</h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/register}" th:object="${user}"><div class="row g-3"><div class="col-md-6"><label>Tên đăng nhập</label><input class="form-control" th:field="*{username}" required></div><div class="col-md-6"><label>Email</label><input class="form-control" type="email" th:field="*{email}" required></div><div class="col-md-6"><label>Họ tên</label><input class="form-control" th:field="*{fullname}" required></div><div class="col-md-6"><label>Số điện thoại</label><input class="form-control" th:field="*{phone}"></div><div class="col-12"><label>Mật khẩu</label><input class="form-control" type="password" th:field="*{password}" required></div></div><button class="btn btn-primary w-100 mt-4">Gửi OTP qua email</button></form></div></div></main></body>
</html>
