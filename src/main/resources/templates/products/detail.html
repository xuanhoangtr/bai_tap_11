<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/user}">
<head><title th:text="${product.productName}">Chi tiết sản phẩm</title></head>
<body><main layout:fragment="content">
    <a class="back-link" th:href="@{/products}">← Quay lại danh sách sản phẩm</a>
    <div class="row g-4 mt-2 align-items-start">
        <div class="col-lg-6"><img class="detail-poster" th:if="${product.image != null and !product.image.isBlank()}" th:src="${#strings.startsWith(product.image, 'upload-') ? '/product-images/' + product.image : '/images/' + product.image}" alt="Ảnh sản phẩm"><div class="detail-image-placeholder" th:unless="${product.image != null and !product.image.isBlank()}">Chưa có ảnh sản phẩm</div></div>
        <div class="col-lg-6">
            <div class="panel">
                <span class="tag" th:text="${product.categoryName}"></span>
                <h1 class="mt-3" th:text="${product.productName}"></h1>
                <p class="description" th:text="${product.description}"></p>
                <p class="h4 text-primary" th:text="${#numbers.formatInteger(product.price, 0, 'POINT') + ' ₫'}"></p>
                <p class="text-muted" th:text="${product.stock > 0 ? 'Còn ' + product.stock + ' sản phẩm trong kho' : 'Tạm hết hàng'}"></p>
                <form class="d-flex gap-2 mt-4" method="post" th:action="@{/products/{id}/cart(id=${product.productId})}">
                    <input class="form-control quantity-input" type="number" name="quantity" min="1" th:max="${product.stock}" value="1" th:disabled="${product.stock < 1}" aria-label="Số lượng">
                    <button class="btn btn-primary" th:disabled="${product.stock < 1}">Thêm vào giỏ</button>
                </form>
                <p class="text-muted mt-3 mb-0">Có thể thanh toán bằng tiền mặt khi nhận hàng (COD).</p>
            </div>
        </div>
    </div>
</main></body>
</html>
