<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/user}">
<head><title>Chi tiết đơn hàng</title></head>
<body>
<main layout:fragment="content">
    <div class="alert alert-success"><h1 class="h4">Chi tiết đơn hàng</h1><p class="mb-0">Đơn <strong th:text="${'#' + order.orderId}"></strong>. Bạn thanh toán COD khi nhận hàng.</p></div>
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="panel">
                <h2 class="h5 mb-3">Sản phẩm</h2>
                <div class="checkout-line" th:each="item : ${order.items}">
                    <span><strong th:text="${item.productName}"></strong><small th:text="${#numbers.formatInteger(item.unitPrice, 0, 'POINT') + ' ₫ × ' + item.quantity}"></small></span>
                    <b th:text="${#numbers.formatInteger(item.lineTotal, 0, 'POINT') + ' ₫'}"></b>
                </div>
                <hr>
                <div class="summary-line"><strong>Tổng cộng</strong><strong th:text="${#numbers.formatInteger(order.totalAmount, 0, 'POINT') + ' ₫'}"></strong></div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="panel">
                <h2 class="h5 mb-3">Giao hàng</h2>
                <div class="profile-grid order-profile">
                    <div><span>Người nhận</span><strong th:text="${order.receiverName}"></strong></div>
                    <div><span>Số điện thoại</span><strong th:text="${order.receiverPhone}"></strong></div>
                    <div class="span-all"><span>Địa chỉ</span><strong th:text="${order.shippingAddress}"></strong></div>
                    <div><span>Phương thức</span><strong th:text="${order.paymentMethod}"></strong></div>
                    <div><span>Trạng thái</span><strong class="badge" th:classappend="${'text-bg-' + order.orderStatusBadgeColor}" th:text="${order.orderStatusLabel}"></strong></div>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex gap-2 mt-4"><a class="btn btn-primary" th:href="@{/orders}">Đơn hàng của tôi</a><a class="btn btn-outline-secondary" th:href="@{/products}">Tiếp tục mua sắm</a></div>
</main>
</body>
</html>
