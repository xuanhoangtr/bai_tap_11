<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/user}">
<head><title>Đơn hàng của tôi</title></head>
<body><main layout:fragment="content"><div class="section-heading mb-4"><div><p class="eyebrow">ĐƠN HÀNG</p><h1>Đơn hàng của tôi</h1></div><a th:href="@{/products}">Tiếp tục mua sắm →</a></div><div class="panel table-responsive" th:if="${!#lists.isEmpty(orders)}"><table class="table align-middle"><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Thanh toán</th><th>Trạng thái</th><th class="text-end">Tổng tiền</th><th></th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${'#' + order.orderId}"></td><td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></td><td>COD</td><td><span class="badge text-bg-warning">Chờ xác nhận</span></td><td class="text-end" th:text="${#numbers.formatInteger(order.totalAmount, 0, 'POINT') + ' ₫'}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/orders/{id}(id=${order.orderId})}">Chi tiết</a></td></tr></tbody></table></div><div class="panel text-center py-5" th:if="${#lists.isEmpty(orders)}"><h2>Bạn chưa có đơn hàng</h2><p class="text-muted">Đơn COD đã đặt sẽ hiển thị tại đây.</p><a class="btn btn-primary" th:href="@{/products}">Mua sắm</a></div></main></body>
</html>
