<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/user}">
<head><title th:text="${video.title}">Chi tiết video</title></head>
<body><main layout:fragment="content"><a class="back-link" th:href="@{/videos}">← Quay lại thư viện</a><div class="detail-card mt-3"><div class="row g-0"><div class="col-lg-6"><img class="detail-poster" th:src="@{'/images/' + ${video.poster}}" alt="Poster video"></div><div class="col-lg-6 p-4 p-lg-5"><span class="tag" th:text="${video.categoryName}"></span><h1 class="mt-3" th:text="${video.title}"></h1><div class="detail-lines"><div><span>Mã video</span><strong th:text="${video.videoCode}"></strong></div><div><span>Category name</span><strong th:text="${video.categoryName}"></strong></div><div><span>View</span><strong th:text="${video.views}"></strong></div></div><p class="description" th:text="${video.description}"></p><div class="d-flex gap-2 flex-wrap"><form method="post" th:action="@{/videos/{id}/like(id=${video.videoId})}"><button class="btn" th:classappend="${video.liked ? 'btn-danger' : 'btn-outline-danger'}">♥ <span th:text="${video.likeCount}"></span> Like</button></form><a class="btn btn-outline-primary" th:if="${session.currentUser == null}" th:href="@{/login}">↗ Share (<span th:text="${video.shareCount}"></span>)</a><button class="btn btn-outline-primary" th:if="${session.currentUser != null}" type="button" data-bs-toggle="collapse" data-bs-target="#shareBox">↗ Share (<span th:text="${video.shareCount}"></span>)</button></div><div id="shareBox" class="collapse mt-3" th:if="${session.currentUser != null}"><form class="d-flex gap-2" method="post" th:action="@{/videos/{id}/share(id=${video.videoId})}"><input class="form-control" type="email" name="email" required placeholder="Email người nhận"><button class="btn btn-primary">Chia sẻ</button></form></div><div class="alert alert-success mt-3" th:if="${param.shared}">Đã lưu lượt chia sẻ.</div></div></div></div></main></body>
</html>
