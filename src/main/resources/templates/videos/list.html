<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/user}">
<head><title>Danh sách video</title></head>
<body><main layout:fragment="content"><div class="section-heading mb-4"><div><p class="eyebrow">VIDEO LIBRARY</p><h1>Video theo category</h1><p class="text-muted mb-0">Mỗi trang hiển thị 3 video theo yêu cầu đề thi.</p></div></div><div class="category-filter mb-4"><a th:classappend="${categoryId == null ? 'active' : ''}" th:href="@{/videos}">Tất cả</a><a th:each="category : ${categories}" th:classappend="${categoryId == category.categoryId ? 'active' : ''}" th:href="@{/videos(categoryId=${category.categoryId})}" th:text="${category.categoryName + ' (' + category.videoCount + ')'}"></a></div><div class="row g-4"><div class="col-md-4" th:each="video : ${pageData.items}"><a class="video-card" th:href="@{/videos/{id}(id=${video.videoId})}"><img th:src="@{'/images/' + ${video.poster}}" alt="Poster"><div class="p-3"><span class="tag" th:text="${video.categoryName}"></span><h3 th:text="${video.title}"></h3><div class="video-meta"><span th:text="${video.videoCode}"></span><span th:text="${video.views + ' views'}"></span></div><div class="video-actions"><span th:text="${'Share (' + video.shareCount + ')'}"></span><span th:text="${'Like (' + video.likeCount + ')'}"></span></div></div></a></div></div><div class="empty-state" th:if="${#lists.isEmpty(pageData.items)}">Chưa có video trong category này.</div><nav class="pagination-wrap" th:if="${pageData.totalPages > 1}"><a th:if="${!pageData.first}" th:href="@{/videos(page=${pageData.page - 1},categoryId=${categoryId})}">‹</a><a th:each="p : ${#numbers.sequence(0, pageData.totalPages - 1)}" th:classappend="${p == pageData.page ? 'active' : ''}" th:href="@{/videos(page=${p},categoryId=${categoryId})}" th:text="${p + 1}"></a><a th:if="${!pageData.last}" th:href="@{/videos(page=${pageData.page + 1},categoryId=${categoryId})}">›</a></nav></main></body>
</html>
